name: Build and Push to GHCR

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write  # 关键：允许写入 GHCR
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Download Camoufox
        run: |          
          mkdir -p dist
          VERSION="135.0.1-beta.24"  # 固定版本，避免自动检测失败
          curl -L "https://github.com/daijro/camoufox/releases/download/v${VERSION}/camoufox-${VERSION}-linux-x86_64.tar.gz" | tar -xz -C dist/
          curl -L https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp -o dist/yt-dlp && chmod +x dist/yt-dlp

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}  # 自动提供

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/camofox-browser:latest
            ghcr.io/${{ github.repository_owner }}/camofox-browser:${{ github.sha }}
